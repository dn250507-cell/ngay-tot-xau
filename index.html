<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ứng dụng tính ngày tốt xấu theo kinh nghiệm dân gian Việt Nam dựa trên ngày sinh và giới tính">
    <title>Tính Ngày Tốt Xấu | Lịch Âm Dương Việt Nam</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☯</text></svg>">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>☯ Tính Ngày Tốt Xấu</h1>
        <p>Theo kinh nghiệm dân gian Việt Nam</p>
    </header>

    <main class="container">
        <!-- Form Section -->
        <section class="form-section">
            <h2 class="form-title">📅 Nhập thông tin của bạn</h2>
            <form id="birth-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="birth-day">Ngày sinh</label>
                        <input type="number" id="birth-day" min="1" max="31" placeholder="VD: 15" required>
                    </div>
                    <div class="form-group">
                        <label for="birth-month">Tháng sinh</label>
                        <input type="number" id="birth-month" min="1" max="12" placeholder="VD: 8" required>
                    </div>
                    <div class="form-group">
                        <label for="birth-year">Năm sinh (Dương lịch)</label>
                        <input type="number" id="birth-year" min="1900" max="2100" placeholder="VD: 1990" required>
                    </div>
                    <div class="form-group">
                        <label for="gender">Giới tính</label>
                        <select id="gender" required>
                            <option value="">-- Chọn --</option>
                            <option value="male">Nam</option>
                            <option value="female">Nữ</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="submit-btn">
                    🔮 Xem Ngày Tốt Xấu
                </button>
            </form>
        </section>

        <!-- Result Section -->
        <section id="result-section" class="result-section">
            <!-- User Info -->
            <div id="user-info"></div>

            <!-- Calendar -->
            <div id="calendar-container"></div>

            <!-- Legend -->
            <div id="legend"></div>
        </section>
    </main>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="CalendarUI.closeModal()">✕</button>
            <div id="detail-content"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data/constants.js"></script>
    <script src="js/lunar-converter.js"></script>
    <script src="js/cuu-cung.js"></script>
    <script src="js/ngay-tot-xau.js"></script>
    <script src="js/calendar-ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
